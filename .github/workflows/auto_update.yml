name: Tu Dong Cap Nhat XSMN

on:
  schedule:
    - cron: '30 10 * * *' # Chạy lúc 17h30 giờ Việt Nam hàng ngày
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công nếu muốn
permissions:
  contents: write  # Cấp quyền cho Bot được phép đẩy (push) code lên lại
jobs:
  update_data:
    runs-on: ubuntu-latest
    steps:
      - name: Kiem tra code
        uses: actions/checkout@v3

      - name: Cai dat Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cai dat thu vien
        run: |
          pip install pandas requests beautifulsoup4 scikit-learn joblib

      - name: Chay script cao du lieu va huan luyen
        run: python auto_run.py # Day la file minh se tao o Buoc 3

      - name: Day du lieu moi len Github
        run: |
          git config --global user.name "AI-Bot"
          git config --global user.email "bot@github.com"
          # Kiểm tra xem file có tồn tại không trước khi add
          git add xsmn_final_clean.csv model_xsmn_predict.pkl || echo "No files to add"
          # Commit nhưng không báo lỗi nếu không có gì thay đổi
          git commit -m "Bot: Tu dong cap nhat du lieu va model $(date)" || exit 0
          # Đẩy lên với tham số --force nếu cần, hoặc push bình thường
          git push origin main
